version: '3.9'

services:
  backend:
    build: ./backend
    image: dentex-backend:latest
    container_name: dentex-backend
    volumes:
      - "./backend:/app"
    ports:
      - "8080:8080"
    restart: always
    shm_size: '2gb'
    environment:
      - TF_FORCE_GPU_ALLOW_GROWTH=true
      - TF_CPP_MIN_LOG_LEVEL=2

  frontend:
    build: ./frontend
    image: dentex-frontend:latest
    container_name: dentex-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - "./frontend:/app"
      - /app/node_modules
    depends_on:
      - backend
